[package]
name = "torrent-stream"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Adaptive, verified BitTorrent video streaming to mpv"

[features]
integration-tests = []

[dependencies]
anyhow = "1"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
async-stream = "0.3"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures-core = "0.3"
getrandom = "0.4"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
cc = "1"
pkg-config = "0.3"
vcpkg = "0.2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
