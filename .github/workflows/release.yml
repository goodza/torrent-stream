name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python3 ci/version.py

  build:
    needs: version
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    env:
      CARGO_TERM_COLOR: always
      VCPKG_COMMIT: 19780d9cdf84d0944cf9a318666703b89ab6629c
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.target }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-v1
          restore-keys: cargo-${{ matrix.target }}-${{ steps.rust.outputs.cachekey }}-

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libboost-dev libssl-dev pkg-config patchelf

      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install boost openssl@3 pkg-config cmake
      - name: libtorrent source for Unix
        if: runner.os != 'Windows'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: arvidn/libtorrent
          ref: 740a0b9aeabe00e762cc0efe4a0f27593db2550b # v2.0.12
          path: .libtorrent
          submodules: recursive
          persist-credentials: false
      - name: Build Unix libtorrent
        if: runner.os != 'Windows'
        shell: bash
        run: |
          prefix_args=()
          if [[ "$RUNNER_OS" == 'macOS' ]]; then
            prefix_args=("-DCMAKE_PREFIX_PATH=$(brew --prefix boost);$(brew --prefix openssl@3)")
          fi
          cmake -S .libtorrent -B "$RUNNER_TEMP/libtorrent-build" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/torrent-native" \
            "${prefix_args[@]}" \
            -DBUILD_SHARED_LIBS=ON -Ddeprecated-functions=ON \
            -Dbuild_tests=OFF -Dbuild_examples=OFF -Dpython-bindings=OFF
          cmake --build "$RUNNER_TEMP/libtorrent-build" --parallel 3
          cmake --install "$RUNNER_TEMP/libtorrent-build"
          if [[ "$RUNNER_OS" == 'macOS' ]]; then
            echo "PKG_CONFIG_PATH=$RUNNER_TEMP/torrent-native/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"
            echo "RUSTFLAGS=-C link-arg=-Wl,-headerpad_max_install_names -C link-arg=-Wl,-rpath,$RUNNER_TEMP/torrent-native/lib" >> "$GITHUB_ENV"
          else
            echo "PKG_CONFIG_PATH=$RUNNER_TEMP/torrent-native/lib/pkgconfig" >> "$GITHUB_ENV"
            echo "LD_LIBRARY_PATH=$RUNNER_TEMP/torrent-native/lib" >> "$GITHUB_ENV"
          fi

      - name: vcpkg source for Windows
        if: runner.os == 'Windows'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: .vcpkg
          persist-credentials: false
      - name: Cache Windows native packages
        id: native-cache
        if: runner.os == 'Windows'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: native-${{ matrix.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('ci/triplets/*') }}-deprfun
      - name: Build Windows libtorrent
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE '.vcpkg'
          $cache = Join-Path $env:RUNNER_TEMP 'vcpkg-cache'
          $env:VCPKG_ROOT = $root
          New-Item -ItemType Directory -Force $cache | Out-Null
          $env:VCPKG_DEFAULT_BINARY_CACHE = $cache
          & "$root/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE) { throw 'vcpkg bootstrap failed' }
          & "$root/vcpkg.exe" install 'libtorrent[core,deprfun]:x64-windows-release' --overlay-triplets="$env:GITHUB_WORKSPACE/ci/triplets" --clean-after-build
          if ($LASTEXITCODE) { throw 'libtorrent installation failed' }
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          'VCPKGRS_TRIPLET=x64-windows-release' >> $env:GITHUB_ENV
          'VCPKGRS_DYNAMIC=1' >> $env:GITHUB_ENV
          "$root/installed/x64-windows-release/bin" >> $env:GITHUB_PATH
      - name: Save compiled Windows native packages
        if: runner.os == 'Windows' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: native-${{ matrix.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('ci/triplets/*') }}-deprfun

      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test scheduler, IPC, paths and local magnet exchange
        run: cargo test --locked --all-features --target ${{ matrix.target }}
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features --target ${{ matrix.target }} -- -D warnings
      - name: Build release
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package and test relocated binary
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: python ci/package.py --target ${{ matrix.target }} --version "$RELEASE_VERSION"
        shell: bash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - name: Publish all binaries after every platform passes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            prerelease=()
            if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --generate-notes "${prerelease[@]}"
          fi
          gh release upload "$RELEASE_TAG" *.tar.gz *.zip SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false
